<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#020617" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Campus Connect - Kiosk</title>
    <!-- PULL-TO-REFRESH CONTROL:
         - Touches INSIDE scrollable containers: scroll smoothly up/down, never trigger pull-to-refresh
         - Touches OUTSIDE scrollable containers: allow normal pull-to-refresh
    -->
    <script>
      (function() {
        var activeScrollEl = null;
        var lastTouchY = 0;

        function findScrollableParent(target) {
          var el = target;
          while (el && el !== document.body && el !== document.documentElement) {
            if (el.nodeType === 1) {
              var style = window.getComputedStyle(el);
              var oy = style.overflowY;
              var ox = style.overflowX;
              if (oy === 'auto' || oy === 'scroll' || ox === 'auto' || ox === 'scroll') {
                return el;
              }
            }
            el = el.parentElement || el.parentNode;
          }
          return null;
        }

        window.addEventListener('touchstart', function(e) {
          if (e.touches.length !== 1) {
            activeScrollEl = null;
            return;
          }
          lastTouchY = e.touches[0].clientY;
          activeScrollEl = findScrollableParent(e.target);

          // If touching a scroll container currently at top (scrollTop 0),
          // set scrollTop to 1px so pulling down moves the element rather than chaining to viewport
          if (activeScrollEl && activeScrollEl.scrollTop === 0 && activeScrollEl.scrollHeight > activeScrollEl.clientHeight) {
            activeScrollEl.scrollTop = 1;
          }
        }, { passive: true, capture: true });

        window.addEventListener('touchmove', function(e) {
          if (e.touches.length !== 1) return;

          // 1. Outside scroll area: allow natural browser behavior (pull-to-refresh)
          if (!activeScrollEl) return;

          // 2. Inside scroll area:
          var currentY = e.touches[0].clientY;
          var dy = currentY - lastTouchY;
          lastTouchY = currentY;

          // If moving finger DOWN while at the top (scrollTop <= 0):
          // Block pull-to-refresh from taking over the scroll container!
          if (dy > 0 && activeScrollEl.scrollTop <= 0) {
            if (e.cancelable) e.preventDefault();
            if (activeScrollEl.scrollHeight > activeScrollEl.clientHeight) {
              activeScrollEl.scrollTop = 1;
            }
          }
          // In all other cases:
          // - dy > 0 and scrollTop > 0: native scroll UP works smoothly
          // - dy < 0: native scroll DOWN works smoothly
        }, { passive: false, capture: true });

        window.addEventListener('touchend', function() {
          activeScrollEl = null;
        }, { passive: true, capture: true });

        window.addEventListener('touchcancel', function() {
          activeScrollEl = null;
        }, { passive: true, capture: true });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
