<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#020617" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Campus Connect - Kiosk</title>
    <!-- PERMANENTLY KILL PULL-TO-REFRESH ACROSS APP:
         Prevents pull-to-refresh when dragging down anywhere at the top of scroll containers or outside,
         while allowing full smooth up/down scrolling throughout all content.
    -->
    <script>
      (function() {
        try {
          document.documentElement.style.overscrollBehavior = 'none';
          document.documentElement.style.overscrollBehaviorY = 'none';
          if (document.body) {
            document.body.style.overscrollBehavior = 'none';
            document.body.style.overscrollBehaviorY = 'none';
          }
        } catch(e) {}

        var activeScrollInfo = null;
        var touchStartY = 0;
        var touchStartX = 0;

        function findScrollableParent(target) {
          var el = target;
          while (el && el !== document.body && el !== document.documentElement) {
            if (el.nodeType === 1) {
              var style = window.getComputedStyle(el);
              var oy = style.overflowY;
              var ox = style.overflowX;
              if (oy === 'auto' || oy === 'scroll') {
                return { el: el, axis: 'y' };
              }
              if (ox === 'auto' || ox === 'scroll') {
                return { el: el, axis: 'x' };
              }
            }
            el = el.parentElement || el.parentNode;
          }
          return null;
        }

        window.addEventListener('touchstart', function(e) {
          if (e.touches.length === 1) {
            touchStartY = e.touches[0].clientY;
            touchStartX = e.touches[0].clientX;
            activeScrollInfo = findScrollableParent(e.target);
          } else {
            activeScrollInfo = null;
          }
        }, { passive: true, capture: true });

        window.addEventListener('touchmove', function(e) {
          if (e.touches.length !== 1) return;
          var currentY = e.touches[0].clientY;
          var currentX = e.touches[0].clientX;
          var dy = currentY - touchStartY;
          var dx = currentX - touchStartX;

          // If horizontal scrolling on chips/horizontal lists:
          if (activeScrollInfo && activeScrollInfo.axis === 'x') {
            if (Math.abs(dx) > Math.abs(dy)) {
              return; // Allow native horizontal scroll
            }
          }

          // If finger is dragging DOWN:
          if (dy > 0) {
            // If NOT in a vertical scroll container, OR if the scroll container is at/near top (scrollTop <= 0):
            // Calling preventDefault physically prevents the browser from initiating pull-to-refresh!
            if (!activeScrollInfo || activeScrollInfo.axis !== 'y' || activeScrollInfo.el.scrollTop <= 0) {
              if (e.cancelable) {
                e.preventDefault();
              }
            }
            // If activeScrollInfo has axis 'y' and scrollTop > 0:
            // e.preventDefault() is NOT called, so the container scrolls UP smoothly towards 0!
          }
          // If dy <= 0 (finger moving UP):
          // e.preventDefault() is NEVER called, so container scrolls DOWN into content smoothly!
        }, { passive: false, capture: true });

        window.addEventListener('touchend', function() {
          activeScrollInfo = null;
        }, { passive: true, capture: true });

        window.addEventListener('touchcancel', function() {
          activeScrollInfo = null;
        }, { passive: true, capture: true });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
