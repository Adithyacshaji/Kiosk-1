<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#020617" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Campus Connect - Kiosk</title>
    <!-- KILL PULL-TO-REFRESH: runs before React/CSS so the browser never sees the gesture -->
    <script>
      // Immediately apply CSS overscroll kill on the root element
      document.documentElement.style.overscrollBehavior = 'none';
      document.documentElement.style.overscrollBehaviorY = 'none';
      document.documentElement.style.touchAction = 'pan-x pan-y';

      // Track touch start position AND snapshot the scrollTop of the nearest
      // scrollable ancestor at the moment the finger lands (not during move,
      // since scrollTop can read as 0 mid-frame due to browser timing).
      var _touchStartY = 0;
      var _scrollableEl = null;
      var _scrollTopAtStart = 0;

      function findScrollableParent(el) {
        while (el && el !== document.documentElement) {
          var style = window.getComputedStyle(el);
          var oy = style.overflowY;
          if ((oy === 'auto' || oy === 'scroll') && el.scrollHeight > el.clientHeight) {
            return el;
          }
          el = el.parentElement;
        }
        return null;
      }

      document.addEventListener('touchstart', function(e) {
        if (e.touches.length !== 1) return;
        _touchStartY = e.touches[0].clientY;
        _scrollableEl = findScrollableParent(e.target);
        // Snapshot scrollTop NOW (reliable at touchstart, not during move)
        _scrollTopAtStart = _scrollableEl ? _scrollableEl.scrollTop : 0;
      }, { passive: true });

      document.addEventListener('touchmove', function(e) {
        if (e.touches.length !== 1) return;
        var dy = e.touches[0].clientY - _touchStartY;

        // Only care about downward pull (dy > 0 = finger moving down = scroll up)
        if (dy <= 0) return;

        // If there is no scrollable ancestor at all → always block
        if (!_scrollableEl) {
          if (e.cancelable) e.preventDefault();
          return;
        }

        // If the scrollable element was already at the top when the touch started
        // → block (this is the pull-to-refresh gesture)
        if (_scrollTopAtStart <= 0) {
          if (e.cancelable) e.preventDefault();
        }
        // Otherwise: element had scrolled content above → let it scroll normally
      }, { passive: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
