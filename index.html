<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#020617" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Campus Connect - Kiosk</title>
    <!-- KILL PULL-TO-REFRESH: capture phase fires BEFORE React/Leaflet passive listeners -->
    <script>
      // CSS kill — applied before any stylesheet loads
      document.documentElement.style.overscrollBehavior = 'none';
      document.documentElement.style.overscrollBehaviorY = 'none';
      document.body && (document.body.style.overscrollBehavior = 'none');

      var _touchStartY = 0;
      var _scrollableEl = null;
      var _scrollTopAtStart = 0;

      function findScrollableParent(el) {
        while (el && el !== document.documentElement) {
          var oy = window.getComputedStyle(el).overflowY;
          if ((oy === 'auto' || oy === 'scroll') && el.scrollHeight > el.clientHeight) return el;
          el = el.parentElement;
        }
        return null;
      }

      // Use CAPTURE phase (capture:true) so this runs BEFORE any element's
      // bubble-phase listeners. React and Leaflet register passive listeners on
      // the bubble path — if those run first, Chrome marks the event as
      // non-cancelable before we get a chance to call preventDefault().
      window.addEventListener('touchstart', function(e) {
        if (e.touches.length !== 1) return;
        _touchStartY = e.touches[0].clientY;
        _scrollableEl = findScrollableParent(e.target);
        _scrollTopAtStart = _scrollableEl ? Math.round(_scrollableEl.scrollTop) : 0;
      }, { passive: true, capture: true });

      window.addEventListener('touchmove', function(e) {
        if (e.touches.length !== 1) return;
        var dy = e.touches[0].clientY - _touchStartY;
        if (dy <= 0) return; // scrolling down (into content) — always allow

        // Finger moving UP on screen = user pulling down = potential pull-to-refresh
        if (!_scrollableEl) {
          // No scrollable parent at all — definitely block
          if (e.cancelable) e.preventDefault();
          return;
        }
        // Scrollable parent existed but was already at the very top when touch started
        if (_scrollTopAtStart <= 0) {
          if (e.cancelable) e.preventDefault();
        }
        // If scrollTopAtStart > 0 the element had content above → let it scroll up normally
      }, { passive: false, capture: true });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
